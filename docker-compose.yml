
# Check_U (github.com/ISCOUTB/check_u) adaptado al servidor del laboratorio.
#
# Servicios:
#   panel:      Aplicacion Flask webapp (puerto interno 5000).
#   backend:    NestJS (puerto interno 3000).
#   frontend:   Next.js (puerto interno 3000).
#   ocr:        Motor de analisis documental (puerto interno 5001).
#   db:         PostgreSQL.
#   db-migrate: Inicializacion del esquema SQL.
#
# Variables en Dokploy:
#   DOMINIO
#   CHECKU_REF
#   DB_USER
#   DB_PASSWORD
#   DB_NAME
#
# Los dominios se configuran desde Dokploy, en Domains.
# No se publican puertos directamente en el host.

services:
  backend:
    build:
      context: https://github.com/ISCOUTB/check_u.git#${CHECKU_REF:-main}:backend
      dockerfile_inline: |
        FROM node:24-slim
        WORKDIR /usr/src/app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY . .
        RUN npm run build && npm prune --omit=dev
        ENV NODE_ENV=production
        EXPOSE 3000
        CMD ["node", "dist/main"]
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=192
      OCR_URL: http://ocr:5001
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  frontend:
    build:
      context: https://github.com/ISCOUTB/check_u.git#${CHECKU_REF:-main}:frontend
      args:
        NEXT_PUBLIC_API_URL: https://api-checku.${DOMINIO:-iscoutb.dev}/api
      dockerfile_inline: |
        FROM node:24-slim
        WORKDIR /usr/src/app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY . .
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        ENV NEXT_TELEMETRY_DISABLED=1
        RUN find app -name 'page.tsx' -empty -exec sh -c 'echo "export default function Page() { return null; }" > "$1"' _ {} \;
        RUN npm run build
        ENV NODE_ENV=production
        EXPOSE 3001
        CMD ["npx", "next", "start", "-p", "3001"]
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # Motor de analisis documental OCR.
  # Dominio asociado en Dokploy al servicio ocr, puerto 5001.
  ocr:
    build:
      context: https://github.com/ISCOUTB/check_u.git#${CHECKU_REF:-main}
      dockerfile_inline: |
        FROM python:3.11-slim

        ENV PYTHONUNBUFFERED=1

        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                tesseract-ocr \
                tesseract-ocr-spa \
                poppler-utils \
                libgl1 \
                libglib2.0-0 \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        COPY modules/requirements.txt /app/modules/requirements.txt
        RUN pip install --no-cache-dir -r /app/modules/requirements.txt

        COPY modules/ /app/modules/
        COPY firma_electronica/ /app/firma_electronica/

        EXPOSE 5001

        CMD ["python", "modules/api/app.py"]

    restart: unless-stopped
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/salud', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?define DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db-migrate:
    build:
      context: https://github.com/ISCOUTB/check_u.git#${CHECKU_REF:-main}:db
      dockerfile_inline: |
        FROM postgres:16
        COPY init/ /sql/
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:?define DB_USER}
      PGPASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      PGDATABASE: ${DB_NAME:?define DB_NAME}
    command:
      - sh
      - -c
      - 'for f in /sql/*.sql; do echo "Aplicando $$f"; psql -v ON_ERROR_STOP=1 -f "$$f" || exit 1; done'

volumes:
  postgres_data:
