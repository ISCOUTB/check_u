
services:
  db:
    image: postgres:16
    container_name: checku-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: checku
      POSTGRES_PASSWORD: checku_local_2026
      POSTGRES_DB: checku_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - checku_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checku -d checku_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  ocr:
    build:
      context: .
      dockerfile: modules/api/Dockerfile
    container_name: checku-ocr-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    init: true

volumes:
  checku_db_data:
